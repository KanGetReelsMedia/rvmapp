<!DOCTYPE html>
<html lang="en" class="bg-black">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Metro Weather | River Valley Metro - LIVE</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
<style>
body{-webkit-tap-highlight-color:transparent; font-family:'Inter',sans-serif}
.glass-panel{background:rgba(15,23,42,0.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);box-shadow:0 8px 32px rgba(0,0,0,0.8)}
#pullIndicator{transform:translateY(-100%);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
#pullIndicator.show{transform:translateY(0)}
#animation-layer{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.particle{position:absolute;top:-50px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
.fade-in{animation:fadeIn .4s ease-out forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.app-container::-webkit-scrollbar{display:none}
</style>
</head>
<body class="text-slate-50 antialiased overflow-hidden h-[100dvh] flex flex-col items-center justify-center relative bg-black">
<div id="pullIndicator" class="fixed top-0 left-1/2 -translate-x-1/2 z-[100] bg-blue-500 text-slate-900 text-[10px] font-black tracking-widest px-6 py-2 rounded-b-2xl">↓ PULL TO REFRESH</div>
<canvas id="canvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>
<div id="animation-layer"></div>
<main class="app-container relative z-10 w-full max-w-[420px] h-[95dvh] overflow-y-auto px-5 pt-8 pb-36" id="scrollContainer">
<header class="glass-panel rounded-[2.5rem] p-6 text-center mb-4">
<div class="w-12 h-1 bg-white/10 rounded-full mx-auto mb-4"></div>
<h1 class="text-2xl font-black tracking-tight leading-none italic uppercase">WEATHER <span class="text-blue-500">OUTLOOK</span></h1>
<p class="text-[10px] mt-2 text-blue-400 font-bold tracking-[0.3em] uppercase opacity-80">Kankakee • Live Transit Forecast</p>
<p id="liveClock" class="mt-2 text-[10px] font-bold tracking-widest text-slate-400">--:-- --</p>
</header>
<!-- Current -->
<div class="glass-panel rounded-[2.5rem] p-7 text-center relative overflow-hidden">
<div class="absolute -top-20 -right-20 w-60 h-60 bg-blue-500/10 rounded-full blur-[40px] pointer-events-none"></div>
<span class="text-[10px] font-black text-blue-400 uppercase tracking-[0.3em] mb-1 block">Current Conditions</span>
<h2 id="weather-desc" class="text-2xl font-black uppercase tracking-tight italic mb-1">Detecting...</h2>
<p id="weather-sub" class="text-[11px] text-slate-400 font-bold tracking-widest uppercase mb-4"></p>
<div class="flex justify-center items-baseline gap-2 mb-5">
<span id="temp-val" class="text-6xl font-black tabular-nums">--</span><span class="text-slate-400 font-bold text-2xl">°F</span>
<span id="feels-like" class="ml-3 text-[11px] font-bold text-slate-400"></span>
</div>
<div class="grid grid-cols-3 gap-2">
<div class="bg-white/[0.04] border border-white/5 p-4 rounded-2xl"><span class="block text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1">Wind</span><span id="wind-val" class="text-[13px] font-black">--</span></div>
<div class="bg-white/[0.04] border border-white/5 p-4 rounded-2xl"><span class="block text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1">Humidity</span><span id="hum-val" class="text-[13px] font-black">--</span></div>
<div class="bg-white/[0.04] border border-white/5 p-4 rounded-2xl"><span class="block text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1">Air Quality</span><span id="aqi-val" class="text-[13px] font-black">Good</span></div>
</div>
<!-- Rider impact -->
<div id="riderAlert" class="mt-4 rounded-2xl px-4 py-3 text-left border text-[11px] leading-snug hidden"></div>
</div>
<!-- Hourly -->
<div class="glass-panel rounded-[2rem] p-5 mt-4">
<h3 class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">Next 8 Hours • Kankakee</h3>
<div id="hourly-list" class="flex gap-2 overflow-x-auto pb-1"></div>
</div>
<!-- 7-day -->
<div class="space-y-2 mt-4" id="forecast-list"></div>
<button onclick="fetchWeather(true)" class="w-full mt-4 py-4 rounded-[1.8rem] font-black text-[11px] tracking-[0.2em] bg-white text-slate-900 active:scale-[0.98] transition-all uppercase flex items-center justify-center gap-2"><span id="refreshIcon">⟳</span> UPDATE FORECAST</button>
<p id="lastUpdated" class="text-center text-[9px] font-bold tracking-widest uppercase opacity-30 mt-3"></p>
</main>
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[94%] max-w-[440px] bg-slate-900/95 backdrop-blur-xl border border-white/10 h-20 rounded-[2.5rem] flex items-center justify-around px-2 shadow-2xl z-[9999]">
<a href="status.html" class="nav-link flex flex-col items-center gap-1.5 text-slate-400 flex-1"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg><span class="text-[8px] font-black uppercase tracking-tighter">Alerts</span></a>
<a href="map.html" class="nav-link flex flex-col items-center gap-1.5 text-slate-400 flex-1"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span class="text-[8px] font-black uppercase tracking-tighter">Find Bus</span></a>
<a href="midway.html" class="nav-link flex flex-col items-center gap-1.5 text-slate-400 flex-1"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg><span class="text-[8px] font-black uppercase tracking-tighter">Midway</span></a>
<a href="notices.html" class="nav-link flex flex-col items-center gap-1.5 text-slate-400 flex-1"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h8a2 2 0 012 2v10s0 2-2 2H8s-2 0-2-2V9a2 2 0 012-2zm0 0V5a2 2 0 012-2h4a2 2 0 012 2v2M9 17v1m6-1v1M6 11h12"/></svg><span class="text-[8px] font-black uppercase tracking-tighter">Notices</span></a>
<a href="passes.html" class="nav-link flex flex-col items-center gap-1.5 text-slate-400 flex-1"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 012-2h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V5z"/></svg><span class="text-[8px] font-black uppercase tracking-tighter">Passes</span></a>
<a href="weather.html" class="nav-link flex flex-col items-center gap-1.5 text-blue-500 flex-1"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg><span class="text-[8px] font-black uppercase tracking-tighter">Weather</span></a>
</nav>
<script id="vs" type="x-shader/x-vertex">attribute vec2 position; void main(){gl_Position=vec4(position,0.,1.);}</script>
<script id="fs" type="x-shader/x-fragment">precision highp float; uniform float uTime; uniform vec2 uRes; void main(){vec2 uv=(gl_FragCoord.xy-0.5*uRes)/min(uRes.x,uRes.y);float t=uTime*0.1;vec3 c=vec3(0.);for(float i=1.;i<4.;i++){uv.x+=.4/i*sin(i*3.*uv.y+t);uv.y+=.4/i*cos(i*3.*uv.x+t);c+=.004/abs(sin(t+uv.y+uv.x));}gl_FragColor=vec4(c*vec3(.05,.2,.6),1.);}</script>
<script>
// Canvas
const canvas=document.createElement('canvas');canvas.id='canvas-el';const orig=document.getElementById('canvas');if(orig){const gl=orig.getContext('webgl');function resize(){orig.width=innerWidth;orig.height=innerHeight;gl.viewport(0,0,orig.width,orig.height)}addEventListener('resize',resize);resize();const program=gl.createProgram();const addShader=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);gl.attachShader(program,s)};addShader(gl.VERTEX_SHADER,document.getElementById('vs').textContent);addShader(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent);gl.linkProgram(program);gl.useProgram(program);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const pos=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);function render(t){if(document.hidden){requestAnimationFrame(render);return}gl.uniform1f(gl.getUniformLocation(program,'uTime'),t*0.001);gl.uniform2f(gl.getUniformLocation(program,'uRes'),orig.width,orig.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(render)}render(0)}
</script>
<script>
const weatherCodes={0:"Clear Sky",1:"Mainly Clear",2:"Partly Cloudy",3:"Overcast",45:"Foggy",48:"Rime Fog",51:"Light Drizzle",53:"Drizzle",55:"Dense Drizzle",61:"Light Rain",63:"Rain",65:"Heavy Rain",71:"Light Snow",73:"Snow",75:"Heavy Snow",80:"Rain Showers",81:"Rain Showers",82:"Heavy Showers",85:"Snow Showers",86:"Heavy Snow",95:"Thunderstorm",96:"Thunderstorm Hail",99:"Thunderstorm Hail"};
async function fetchWeather(manual=false){
  const icon=document.getElementById('refreshIcon');
  if(manual){icon.textContent='⟳';icon.className='animate-spin inline-block'}
  try{
    const url="https://api.open-meteo.com/v1/forecast?latitude=41.12&longitude=-87.86&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_gusts_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=America/Chicago&forecast_days=7";
    const res=await fetch(url);
    if(!res.ok)throw new Error('net');
    const data=await res.json();
    const cur=data.current;
    document.getElementById("weather-desc").textContent=weatherCodes[cur.weather_code]||"Fair";
    document.getElementById("temp-val").textContent=Math.round(cur.temperature_2m);
    document.getElementById("wind-val").textContent=`${Math.round(cur.wind_speed_10m)} mph`;
    document.getElementById("hum-val").textContent=`${cur.relative_humidity_2m}%`;
    document.getElementById("feels-like").textContent=`Feels ${Math.round(cur.apparent_temperature)}°`;
    document.getElementById("weather-sub").textContent=`Gusts ${Math.round(cur.wind_gusts_10m)} mph • ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;
    
    // Rider impact
    const rider=document.getElementById('riderAlert');
    let impact='';let cls='mt-4 rounded-2xl px-4 py-3 text-left border text-[11px] leading-snug ';
    if(cur.weather_code>=71&&cur.weather_code<=86){impact='❄ Snow may cause minor bus delays. Allow extra time at stops.';cls+='bg-blue-500/10 border-blue-500/20 text-blue-200'}
    else if(cur.weather_code>=61&&cur.weather_code<=82){impact='🌧 Rain in area — shelters may be crowded. Buses running.';cls+='bg-blue-500/10 border-blue-500/20 text-blue-200'}
    else if(cur.weather_code>=95){impact='⛈ Thunderstorm — potential detours. Check ALERTS tab.';cls+='bg-red-500/10 border-red-500/20 text-red-200'}
    else if(cur.wind_speed_10m>20){impact='💨 High winds — hold belongings at open stops.';cls+='bg-amber-500/10 border-amber-500/20 text-amber-200'}
    else if(cur.temperature_2m<20){impact='🥶 Freezing temps — dress warm, use Metro Centre waiting area.';cls+='bg-slate-500/10 border-white/10 text-slate-300'}
    else {impact='✅ Good transit weather — buses on time.';cls+='bg-emerald-500/10 border-emerald-500/20 text-emerald-200'}
    rider.className=cls; rider.textContent=impact; rider.classList.remove('hidden');
    renderHourly(data.hourly);
    renderForecast(data.daily);
    renderVisuals(cur.weather_code);
    document.getElementById('lastUpdated').textContent=`Updated ${new Date().toLocaleTimeString()} • Open-Meteo • Kankakee, IL`;
    localStorage.setItem('rvm_weather_cache', JSON.stringify({data, ts:Date.now()}));
  }catch(e){
    console.error(e);
    const cached=localStorage.getItem('rvm_weather_cache');
    if(cached){try{const {data}=JSON.parse(cached);document.getElementById('weather-desc').textContent=weatherCodes[data.current.weather_code]||"Cached";document.getElementById('temp-val').textContent=Math.round(data.current.temperature_2m);renderForecast(data.daily);renderHourly(data.hourly)}catch{}}
    else document.getElementById('weather-desc').textContent='Offline — Cached unavailable';
  }finally{icon.textContent='⟳';icon.className=''}
}
function renderHourly(hourly){
  const list=document.getElementById('hourly-list');list.innerHTML='';
  const now=new Date();const curHour=now.getHours();
  for(let i=curHour;i<Math.min(curHour+8,hourly.time.length);i++){
    const t=new Date(hourly.time[i]);
    const label=i===curHour?'Now':t.toLocaleTimeString('en-US',{hour:'numeric'});
    const temp=Math.round(hourly.temperature_2m[i]);
    const code=hourly.weather_code[i];
    const div=document.createElement('div');
    div.className='flex flex-col items-center bg-white/[0.04] border border-white/5 rounded-2xl px-3 py-3 min-w-[60px]';
    div.innerHTML=`<span class="text-[8px] font-black tracking-widest text-slate-500 uppercase">${label}</span><span class="text-[11px] mt-1">${(weatherCodes[code]||'').slice(0,8)}</span><span class="text-[13px] font-black mt-1">${temp}°</span>`;
    list.appendChild(div);
  }
}
function renderForecast(daily){
  const list=document.getElementById('forecast-list');list.innerHTML='';
  for(let i=0;i<Math.min(7,daily.time.length);i++){
    const date=new Date(daily.time[i]+"T00:00");
    const dayName=i===0?'Today':i===1?'Tomorrow':date.toLocaleDateString('en-US',{weekday:'short'});
    const high=Math.round(daily.temperature_2m_max[i]);const low=Math.round(daily.temperature_2m_min[i]);
    const condition=weatherCodes[daily.weather_code[i]]||'Fair';
    const precip=daily.precipitation_probability_max[i];
    const card=document.createElement('div');
    card.className='glass-panel p-4 rounded-[1.6rem] flex justify-between items-center fade-in';
    card.style.animationDelay=`${i*0.05}s`;
    card.innerHTML=`<div><span class="block text-[9px] font-black text-slate-400 uppercase tracking-widest">${dayName} • ${precip}% rain</span><span class="font-black text-[13px] uppercase">${condition}</span></div><div class="text-right"><span class="text-[18px] font-black">${high}°</span><span class="text-[12px] font-bold text-slate-400 ml-1">${low}°</span></div>`;
    list.appendChild(card);
  }
}
function renderVisuals(code){
  const layer=document.getElementById('animation-layer');layer.innerHTML='';
  if(code>=51){
    const char=code>=71?'❄':code>=95?'⚡':'💧';
    for(let i=0;i<22;i++){const p=document.createElement('div');p.className='particle';p.textContent=char;p.style.left=Math.random()*100+'vw';p.style.animationDuration=(Math.random()*2+2)+'s';p.style.fontSize=(Math.random()*8+10)+'px';p.style.opacity=Math.random()*0.4+0.2;layer.appendChild(p)}
  }
}
// Clock + pull to refresh
let startY=0,pulling=false;
const scrollEl=document.getElementById('scrollContainer');const pullEl=document.getElementById('pullIndicator');
scrollEl.addEventListener('touchstart',e=>{if(scrollEl.scrollTop<=0)startY=e.touches[0].clientY},{passive:true});
scrollEl.addEventListener('touchmove',e=>{
  if(scrollEl.scrollTop>0)return;
  const dy=e.touches[0].clientY-startY;
  if(dy>20&&dy<140){pulling=true;pullEl.classList.add('show');pullEl.textContent=dy>80?'↻ RELEASE TO REFRESH':'↓ PULL TO REFRESH';}
},{passive:true});
scrollEl.addEventListener('touchend',()=>{
  if(pulling){const txt=pullEl.textContent;if(txt.includes('RELEASE')){pullEl.textContent='⟳ REFRESHING...';setTimeout(()=>{fetchWeather(true);pullEl.classList.remove('show');if(navigator.vibrate)navigator.vibrate(20)},400)}else pullEl.classList.remove('show')}
  pulling=false;
});
setInterval(()=>{const c=document.getElementById('liveClock');if(c){const n=new Date();c.textContent=n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})+' • '+n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}},1000);
window.onload=()=>{fetchWeather();const c=document.getElementById('liveClock');if(c){const n=new Date();c.textContent=n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})+' • '+n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}};
</script>
</body>
