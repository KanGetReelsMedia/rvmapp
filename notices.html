<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>RVM Premium | Service Alerts - FIXED</title><script src="https://cdn.tailwindcss.com"></script>
<style>
  /* LIGHTER LIKE THE OTHER PAGES - CSS ONLY, NO LOGIC CHANGE */
  body{background:linear-gradient(180deg,#eaf2fb 0%,#dbe7f3 45%,#cbd5e1 100%) !important;color:#000 !important}
  /* Override the dark Tailwind classes used in the HTML + JS-rendered cards */
  .bg-slate-900\/80{background:rgba(255,255,255,.82) !important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(0,0,0,.14) !important;box-shadow:0 8px 24px rgba(0,0,0,.12) !important;color:#000 !important}
  .border-white\/10{border-color:rgba(0,0,0,.14) !important}
  .text-slate-50{color:#000 !important}
  .text-slate-300{color:#1e293b !important}
  .text-slate-400{color:#475569 !important}
  .text-slate-500{color:#64748b !important}
  .text-emerald-400{color:#047857 !important}
  .text-blue-400{color:#1d4ed8 !important}
  .text-blue-500{color:#1d4ed8 !important}
  .bg-blue-500\/10{background:rgba(29,78,216,.08) !important}
  /* Keep severity left-border colours */
  .border-l-red-500{border-left-color:#ef4444 !important}
  .border-l-amber-500{border-left-color:#f59e0b !important}
  .border-l-blue-500{border-left-color:#3b82f6 !important}
  .border-emerald-500\/20{border-color:rgba(4,120,87,.3) !important}
  /* --- HAMBURGER + DRAWER --- */
  #hamburgerBtn{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:14px;z-index:9998;width:48px;height:48px;border-radius:9999px;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.14);box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
  #hamburgerBtn span{display:block;width:20px;height:2.5px;border-radius:999px;background:#000;transition:.3s}
  #hamburgerBtn.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
  #hamburgerBtn.open span:nth-child(2){opacity:0}
  #hamburgerBtn.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
  #drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9990;opacity:0;pointer-events:none;transition:.3s}
  #drawerOverlay.show{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;left:0;height:100dvh;width:min(300px,84vw);z-index:9995;background:#eef2f7;color:#000;border-right:1px solid rgba(0,0,0,.14);box-shadow:0 8px 24px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;padding:22px 18px calc(env(safe-area-inset-bottom) + 18px)}
  #drawer.show{transform:translateX(0)}
  .drawer-link{display:flex;align-items:center;gap:12px;padding:14px 14px;border-radius:18px;background:#fff;border:1px solid rgba(0,0,0,.12);font-weight:800;font-size:13px;color:#000;text-decoration:none}
  .drawer-link.active{background:#0284c7;color:#fff !important;border-color:#0284c7}
  .drawer-link.active span{color:#fff !important}
</style>
</head>
<body class="bg-black text-slate-50 min-h-screen flex justify-center">
<!-- HAMBURGER -->
<button id="hamburgerBtn" aria-label="Open menu" onclick="toggleDrawer()"><span></span><span></span><span></span></button>
<div id="drawerOverlay" onclick="toggleDrawer(false)"></div>
<aside id="drawer">
  <div class="flex items-center gap-3 pb-4 border-b border-black/10">
    <div><p class="font-black text-[15px] leading-tight">SYSTEM ALERTS</p><p class="text-[9px] font-bold tracking-[0.25em] text-blue-600 uppercase">Live • Connected to Dispatch</p></div>
  </div>
  <nav class="flex flex-col gap-2.5 mt-5">
    <a href="status.html" class="drawer-link active" data-page="status.html">⚠ <span>Alerts</span><span class="ml-auto text-[10px]">●</span></a>
    <a href="index.html" class="drawer-link" data-page="index.html">🚌 <span>Find Bus</span><span class="ml-auto text-[10px] opacity-50">→</span></a>
    <a href="midway.html" class="drawer-link" data-page="midway.html">✈ <span>Midway</span><span class="ml-auto text-[10px] opacity-50">→</span></a>
    <a href="notices.html" class="drawer-link" data-page="notices.html">📋 <span>Notices</span><span class="ml-auto text-[10px] opacity-50">→</span></a>
    <a href="passes.html" class="drawer-link" data-page="passes.html">🎫 <span>Passes</span><span class="ml-auto text-[10px] opacity-50">→</span></a>
    <a href="weather.html" class="drawer-link" data-page="weather.html">☁ <span>Weather</span><span class="ml-auto text-[10px] opacity-50">→</span></a>
  </nav>
  <div class="mt-auto space-y-3">
    <a href="tel:8159374287" class="drawer-link justify-center !bg-[#0b2a4a] !text-white !border-[#0b2a4a]">📞 CALL DISPATCH</a>
    <a href="https://www.rivervalleymetro.com" target="_blank" class="block text-center text-[10px] font-bold tracking-widest text-blue-600 uppercase">rivervalleymetro.com ↗</a>
  </div>
</aside>
<main class="w-full max-w-[420px] px-5 pt-8 pb-10">
<header class="bg-slate-900/80 border border-white/10 rounded-[2rem] p-6 text-center"><p class="text-[10px] font-black tracking-[0.3em] text-emerald-400">LIVE • Connected to Dispatch</p><h1 class="text-2xl font-black italic">SYSTEM <span class="text-blue-500">ALERTS</span></h1><div id="connStatus" class="mt-3 text-[10px] font-bold px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 inline-block">Connecting...</div><div id="debugCount" class="mt-2 text-[9px] text-slate-500"></div></header>
<div id="alerts-list" class="space-y-4 mt-4"><div class="text-center text-xs text-blue-400 animate-pulse">LOADING LIVE ALERTS...</div></div>
</main>

<script>
function toggleDrawer(force){const d=document.getElementById('drawer'),o=document.getElementById('drawerOverlay'),b=document.getElementById('hamburgerBtn');const show=force!==undefined?force:!d.classList.contains('show');d.classList.toggle('show',show);o.classList.toggle('show',show);b.classList.toggle('open',show);}
// Mark alerts as seen when viewing this page - clears red dot on Find Bus
try { localStorage.setItem('rvm_last_seen_notices_ts', String(Date.now())); } catch(e) {}
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCRDkusyC05EzBiT8ZBj8JpZd8E5qVd-4g",authDomain:"rvm-software-manifest.firebaseapp.com",databaseURL:"https://rvm-software-manifest-default-rtdb.firebaseio.com",projectId:"rvm-software-manifest",storageBucket:"rvm-software-manifest.appspot.com",messagingSenderId:"1096220577213",appId:"1:1096220577213:web:8c9a0f8f1a2b3c4d5e6f7a"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
function render(val){
 const container=document.getElementById('alerts-list');const conn=document.getElementById('connStatus');const dbg=document.getElementById('debugCount');
 const all=Object.entries(val||{}).map(([id,d])=>({id,...d}));
 // SAME filter as dispatch - no dedup, no limit
 const live=all.filter(a=>a.active!==false&&(!a.expiresAtTS||Date.now()<a.expiresAtTS)&&(!a.startsAtTS||Date.now()>=a.startsAtTS)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 dbg.textContent=`In database: ${all.length} • Live now: ${live.length} • Scheduled/hidden: ${all.length-live.length}`;
 if(!live.length){conn.textContent='● Connected - No active alerts';container.innerHTML=`<div class="bg-slate-900/80 border border-emerald-500/20 rounded-3xl p-8 text-center"><h3 class="text-lg font-black">System Normal</h3><p class="text-xs text-slate-400 mt-1">All routes operating on schedule.</p></div>`;return}
 conn.textContent=`● LIVE - ${live.length} active broadcast${live.length>1?'s':''}`;
 container.innerHTML=live.map(a=>`<div class="bg-slate-900/80 border border-white/10 rounded-3xl p-5 border-l-4 ${a.severity==='high'?'border-l-red-500':a.severity==='medium'?'border-l-amber-500':'border-l-blue-500'}"><div class="flex justify-between text-[10px]"><span class="text-blue-400 font-black">${a.route||'SYSTEM'}</span><span class="text-slate-500">${a.timestamp||''}</span></div><h3 class="font-black uppercase mt-2">${a.title||''}</h3><p class="text-[13px] text-slate-300 mt-1">${a.message||''}</p></div>`).join('');
}
onValue(ref(db,'alerts'),snap=>render(snap.val()),err=>{document.getElementById('connStatus').textContent='Error: '+err.message});
</script></body></html>
