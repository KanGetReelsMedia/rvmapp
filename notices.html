<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>RVM Premium | Service Alerts - FIXED</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-slate-50 min-h-screen flex justify-center">
<main class="w-full max-w-[420px] px-5 pt-8 pb-32">
<header class="bg-slate-900/80 border border-white/10 rounded-[2rem] p-6 text-center"><p class="text-[10px] font-black tracking-[0.3em] text-emerald-400">LIVE • Connected to Dispatch</p><h1 class="text-2xl font-black italic">SYSTEM <span class="text-blue-500">ALERTS</span></h1><div id="connStatus" class="mt-3 text-[10px] font-bold px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 inline-block">Connecting...</div><div id="debugCount" class="mt-2 text-[9px] text-slate-500"></div></header>
<div id="alerts-list" class="space-y-4 mt-4"><div class="text-center text-xs text-blue-400 animate-pulse">LOADING LIVE ALERTS...</div></div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCRDkusyC05EzBiT8ZBj8JpZd8E5qVd-4g",authDomain:"rvm-software-manifest.firebaseapp.com",databaseURL:"https://rvm-software-manifest-default-rtdb.firebaseio.com",projectId:"rvm-software-manifest",storageBucket:"rvm-software-manifest.appspot.com",messagingSenderId:"1096220577213",appId:"1:1096220577213:web:8c9a0f8f1a2b3c4d5e6f7a"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
function render(val){
 const container=document.getElementById('alerts-list');const conn=document.getElementById('connStatus');const dbg=document.getElementById('debugCount');
 const all=Object.entries(val||{}).map(([id,d])=>({id,...d}));
 // SAME filter as dispatch - no dedup, no limit
 const live=all.filter(a=>a.active!==false&&(!a.expiresAtTS||Date.now()<a.expiresAtTS)&&(!a.startsAtTS||Date.now()>=a.startsAtTS)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 dbg.textContent=`In database: ${all.length} • Live now: ${live.length} • Scheduled/hidden: ${all.length-live.length}`;
 if(!live.length){conn.textContent='● Connected - No active alerts';container.innerHTML=`<div class="bg-slate-900/80 border border-emerald-500/20 rounded-3xl p-8 text-center"><h3 class="text-lg font-black">System Normal</h3><p class="text-xs text-slate-400 mt-1">All routes operating on schedule.</p></div>`;return}
 conn.textContent=`● LIVE - ${live.length} active broadcast${live.length>1?'s':''}`;
 container.innerHTML=live.map(a=>`<div class="bg-slate-900/80 border border-white/10 rounded-3xl p-5 border-l-4 ${a.severity==='high'?'border-l-red-500':a.severity==='medium'?'border-l-amber-500':'border-l-blue-500'}"><div class="flex justify-between text-[10px]"><span class="text-blue-400 font-black">${a.route||'SYSTEM'}</span><span class="text-slate-500">${a.timestamp||''}</span></div><h3 class="font-black uppercase mt-2">${a.title||''}</h3><p class="text-[13px] text-slate-300 mt-1">${a.message||''}</p></div>`).join('');
}
onValue(ref(db,'alerts'),snap=>render(snap.val()),err=>{document.getElementById('connStatus').textContent='Error: '+err.message});
</script></body></html>
