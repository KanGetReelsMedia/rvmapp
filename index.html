<script type="module">
// ONLY RTDB + RED DOT - NO PUSH, NO MESSAGING
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyCRDkusyC05EzBiT8ZBj8JpZd8E5qVd-4g",
  authDomain: "rvm-software-manifest.firebaseapp.com",
  databaseURL: "https://rvm-software-manifest-default-rtdb.firebaseio.com",
  projectId: "rvm-software-manifest",
  storageBucket: "rvm-software-manifest.appspot.com",
  messagingSenderId: "1096220577213",
  appId: "1:1096220577213:web:8c9a0f8f1a2b3c4d5e6f7a"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
// RED DOT LOGIC FOR ALERTS TAB
const alertsRefForDot = ref(db, 'alerts');
onValue(alertsRefForDot, (snap)=>{
  const val = snap.val();
  const dot = document.getElementById('noticesDot');
  const countEl = document.getElementById('noticesCount');
  const statusText = document.getElementById('statusText');
  if(!dot) return;
  if(!val){
    dot.classList.add('hidden');
    if(countEl) countEl.classList.add('hidden');
    return;
  }
  const entries = Object.entries(val).map(([id,data])=>({id,...data}))
    .filter(a=>a.active!==false && (!a.expiresAtTS || Date.now() < a.expiresAtTS))
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const lastSeen = parseInt(localStorage.getItem('rvm_last_seen_notices_ts')||'0');
  const unread = entries.filter(a=>(a.createdAt||0) > lastSeen);
  if(unread.length>0 && entries.length>0){
    dot.classList.remove('hidden');
    if(countEl){
      countEl.textContent = unread.length>9?'9+':unread.length;
      countEl.classList.remove('hidden');
    }
    if(navigator.vibrate) navigator.vibrate([100,50,100]);
    // Optional: show latest alert in status-msg bar
    if(statusText && unread[0]){
      statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 inline-block mr-2 animate-pulse"></span><b class="text-red-400">${unread[0].route||'SYSTEM'} ALERT:</b> ${unread[0].title} - Tap NOTICES to view`;
    }
  } else {
    dot.classList.add('hidden');
    if(countEl) countEl.classList.add('hidden');
  }
});
</script>
