    <script id="vs" type="x-shader/x-vertex">attribute vec2 position; void main(){gl_Position=vec4(position,0.,1.);}</script>
    <script id="fs" type="x-shader/x-fragment">precision highp float; uniform float uTime; uniform vec2 uRes; void main(){vec2 uv=(gl_FragCoord.xy-0.5*uRes)/min(uRes.x,uRes.y);float t=uTime*0.1;vec3 c=vec3(0.);for(float i=1.;i<4.;i++){uv.x+=.4/i*sin(i*3.*uv.y+t);uv.y+=.4/i*cos(i*3.*uv.x+t);c+=.004/abs(sin(t+uv.y+uv.x));}gl_FragColor=vec4(c*vec3(.05,.2,.6),1.);}</script>
    <script>
        // Canvas - paused when tab hidden
        const canvas=document.getElementById('canvas'),gl=canvas.getContext('webgl');
        function resize(){canvas.width=innerWidth;canvas.height=innerHeight;gl.viewport(0,0,canvas.width,canvas.height)};addEventListener('resize',resize);resize();
        const program=gl.createProgram();const addShader=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);gl.attachShader(program,s)};addShader(gl.VERTEX_SHADER,vs.textContent);addShader(gl.FRAGMENT_SHADER,fs.textContent);gl.linkProgram(program);gl.useProgram(program);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const pos=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);
        let raf=null;function renderCanvas(t){if(document.hidden){raf=requestAnimationFrame(renderCanvas);return}gl.uniform1f(gl.getUniformLocation(program,'uTime'),t*0.001);gl.uniform2f(gl.getUniformLocation(program,'uRes'),canvas.width,canvas.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);raf=requestAnimationFrame(renderCanvas)};renderCanvas(0);
        // Schedules
        const weekdaySchedule=[{b:"4:45 AM",m:"6:00 AM"},{b:"6:00 AM",m:"7:15 AM"},{b:"7:25 AM",m:"8:45 AM"},{b:"8:45 AM",m:"10:05 AM"},{b:"10:15 AM",m:"11:35 AM"},{b:"11:35 AM",m:"12:55 PM"},{b:"1:25 PM",m:"2:45 PM"},{b:"3:05 PM",m:"4:25 PM"},{b:"4:15 PM",m:"5:35 PM"},{b:"5:50 PM",m:"7:05 PM"},{b:"7:05 PM",m:"8:20 PM"}];
        const saturdaySchedule=[{b:"7:00 AM",m:"8:15 AM"},{b:"9:40 AM",m:"11:00 AM"},{b:"12:30 PM",m:"1:50 PM"},{b:"4:20 PM",m:"5:40 PM"},{b:"7:05 PM",m:"8:20 PM"}];
        const sundaySchedule=[{b:"8:00 AM",m:"9:15 AM"},{b:"10:35 AM",m:"11:55 AM"},{b:"1:20 PM",m:"2:40 PM"},{b:"4:05 PM",m:"5:25 PM"}];
        const HOLIDAYS_2026=["2026-01-01","2026-01-19","2026-02-16","2026-05-25","2026-06-19","2026-07-04","2026-09-07","2026-11-11","2026-11-26","2026-12-25"];
        function isHoliday(d){const iso=d.toISOString().slice(0,10);return HOLIDAYS_2026.includes(iso)}
        function parseTime(t){if(!t)return 0;let[time,mod]=t.split(" ");let[h,m]=time.split(":").map(Number);if(mod==="PM"&&h!==12)h+=12;if(mod==="AM"&&h===12)h=0;return h*60+m}
        function getBusState(schedule,key,cur){
            // Bourbonnais->Midway is ~95 min, Midway->Bourbonnais ~85
            const trip= key==='b'?95:85;
            for(let i=0;i<schedule.length;i++){
                const start=parseTime(schedule[i][key]);
                const end=start+trip;
                if(cur>=start && cur<end){
                    const minsLeft=end-cur;
                    return {state:'ACTIVE', bus:schedule[i], minsLeft, progress:((cur-start)/trip*100).toFixed(0)};
                }
            }
            const next=schedule.find(b=>parseTime(b[key])>cur);
            if(next){
                return {state:'UPCOMING', bus:next, minsUntil:parseTime(next[key])-cur};
            }
            return {state:'DONE'};
        }
        window.liveAlerts=[];
        function normalizeRoute(r){if(!r)return"";r=r.toString().trim().toUpperCase();if(r.includes("SYSTEM")||r==="ALL"||r==="SYSTEM WIDE")return"SYSTEM";if(r==="MIDWAY")return"MIDWAY";let m=r.match(/RT\s*0*(\d+)/);if(m)return`ROUTE ${m[1]}`;m=r.match(/ROUTE\s*0*(\d+)/);if(m)return`ROUTE ${m[1]}`;return r}
        function getMidwayAlert(){
            if(!window.liveAlerts||window.liveAlerts.length===0)return null;
            const sorted=[...window.liveAlerts].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
            let match=sorted.find(a=>a.active!==false&&normalizeRoute(a.route)==='MIDWAY');
            if(!match)match=sorted.find(a=>a.active!==false&&normalizeRoute(a.route)==='SYSTEM');
            if(!match){match=sorted.find(a=>{if(a.active===false)return false;if(a.routes&&Array.isArray(a.routes)){return a.routes.some(r=>normalizeRoute(r)==='MIDWAY'||normalizeRoute(r)==='SYSTEM')}return false})}
            return match||null;
        }
        function applyLiveMidwayStatus(){
            const alert=getMidwayAlert();
            const statusIcon=document.getElementById('statusIcon');
            const statusText=document.getElementById('statusText');
            const statusSub=document.getElementById('statusSub');
            const liveBox=document.getElementById('midwayLiveBox');
            if(!alert){if(liveBox)liveBox.classList.add('hidden');return false}
            const shortStatus=(alert.badgeStatus||alert.title||'DELAYED').toString().toUpperCase();
            const sev=(alert.severity||'high').toLowerCase();
            if(liveBox){
                liveBox.classList.remove('hidden');
                if(sev==='high')liveBox.className='mt-4 rounded-2xl px-4 py-3 text-left border text-[11px] leading-snug bg-red-500/10 border-red-500/20 text-red-200';
                else if(sev==='medium')liveBox.className='mt-4 rounded-2xl px-4 py-3 text-left border text-[11px] leading-snug bg-amber-500/10 border-amber-500/20 text-amber-200';
                else liveBox.className='mt-4 rounded-2xl px-4 py-3 text-left border text-[11px] leading-snug bg-emerald-500/10 border-emerald-500/20 text-emerald-200';
                liveBox.innerHTML=`<div class="font-black text-[10px] uppercase tracking-widest mb-1 opacity-70">DISPATCH: ${shortStatus}</div><div class="font-bold">${alert.title||shortStatus}</div><div class="mt-1 opacity-80">${alert.message||''}</div>`;
            }
            if(sev==='high'){statusIcon.className="w-10 h-10 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center mb-2 border border-red-500/20 animate-pulse";statusText.className="text-xs font-black text-red-400 uppercase tracking-tight text-center leading-tight";statusText.textContent=shortStatus;statusSub.textContent="LIVE FROM DISPATCH"}
            else if(sev==='medium'){statusIcon.className="w-10 h-10 bg-amber-500/10 text-amber-400 rounded-full flex items-center justify-center mb-2 border border-amber-500/20";statusText.className="text-xs font-black text-amber-400 uppercase tracking-tight text-center leading-tight";statusText.textContent=shortStatus;statusSub.textContent="LIVE FROM DISPATCH"}
            else{if(shortStatus.includes('ON TIME')){statusIcon.className="w-10 h-10 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mb-2 border border-emerald-500/20";statusText.className="text-xs font-black text-emerald-400 uppercase tracking-tight text-center leading-tight";statusText.textContent="ON TIME";statusSub.textContent="LIVE FROM DISPATCH"}else{statusIcon.className="w-10 h-10 bg-blue-500/10 text-blue-400 rounded-full flex items-center justify-center mb-2 border border-blue-500/20";statusText.className="text-xs font-black text-blue-400 uppercase tracking-tight text-center leading-tight";statusText.textContent=shortStatus;statusSub.textContent="LIVE FROM DISPATCH"}}
            return true;
        }
        function renderSchedule(){
            const now=new Date();
            const cur=now.getHours()*60+now.getMinutes();
            const d=now.getDay();
            let schedule=weekdaySchedule;let title="Weekday Schedule";
            if(isHoliday(now)){schedule=sundaySchedule;title="Holiday • Sunday Schedule"}
            else if(d===0){schedule=sundaySchedule;title="Sunday Schedule"}
            else if(d===6){schedule=saturdaySchedule;title="Saturday Schedule"}
            document.getElementById('dayTitle').textContent=title;
            const north=getBusState(schedule,'b',cur);
            const south=getBusState(schedule,'m',cur);
            // Overall active check
            const lastDep=Math.max(...schedule.map(s=>parseTime(s.m)))+90;
            const systemActive=cur<lastDep;
            // Render cards
            function renderCard(dir,label,timeObj){
                const tripKey=dir==='north'?'b':'m';
                const bg=dir==='north'?'bg-blue-600/90 border-blue-400/20 btn-pulse':'bg-slate-900/80 border-white/5';
                let statusHtml='';
                if(timeObj.state==='ACTIVE'){
                    statusHtml=`<div class="mt-2"><div class="flex justify-between text-[9px] font-black uppercase tracking-widest opacity-70 mb-1"><span>● EN ROUTE</span><span>${timeObj.minsLeft} MIN TO ARRIVAL</span></div><div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden"><div class="h-full bg-white rounded-full transition-all" style="width:${timeObj.progress}%"></div></div><p class="text-[10px] mt-2 opacity-80">Departed ${timeObj.bus[tripKey]} • Arriving ~${timeObj.minsLeft}m</p></div>`;
                } else if(timeObj.state==='UPCOMING'){
                    const hrs=Math.floor(timeObj.minsUntil/60);const mins=timeObj.minsUntil%60;
                    const inTxt=hrs>0?`IN ${hrs}H ${mins}M`:`IN ${mins} MIN`;
                    statusHtml=`<p class="text-lg font-black mt-1 leading-none">${timeObj.bus[tripKey]} <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full ml-2">${inTxt}</span></p><p class="text-[10px] mt-1 opacity-60">Next Departure</p>`;
                } else {
                    statusHtml=`<p class="text-[10px] font-bold mt-1 opacity-50 uppercase tracking-widest">No More Buses Today</p>`;
                }
                const isActive=timeObj.state==='ACTIVE';
                const timeDisplay=timeObj.state==='UPCOMING'? '':(isActive? '':timeObj.bus?timeObj.bus[tripKey]:'');
                // for UPCOMING we already rendered time inside statusHtml, so hide duplicate
                return `<div class="${bg} border p-5 rounded-2xl text-white shadow-lg ${isActive?'ring-2 ring-white/20':''}">
                    <p class="text-[9px] font-black uppercase opacity-70 mb-1 tracking-widest">${label}</p>
                    <p class="text-sm font-black leading-tight uppercase tracking-wide">${dir==='north'?'Bourbonnais → Midway':'Midway → Bourbonnais'}</p>
                    ${timeObj.state!=='UPCOMING'?`<p class="text-lg font-black mt-1 leading-none">${timeObj.bus?timeObj.bus[tripKey]:''}</p>`:''}
                    ${statusHtml}
                </div>`;
            }
            document.getElementById('busButtons').innerHTML=renderCard('north','Northbound',north)+renderCard('south','Southbound',south);
            // Next in overall
            const nextMins=Math.min(north.minsUntil??9999,south.minsUntil??9999);
            const nextEl=document.getElementById('nextIn');
            const titleEl=document.getElementById('countdownTitle');
            if(north.state==='ACTIVE'||south.state==='ACTIVE'){
                titleEl.textContent='LIVE • BUS EN ROUTE';
                nextEl.textContent='';
            } else if(nextMins<9999){
                const h=Math.floor(nextMins/60);const m=nextMins%60;
                nextEl.textContent=h>0?`NEXT BUS IN ${h}H ${m}M`:`NEXT BUS IN ${m} MIN`;
                titleEl.textContent='Current Service';
            } else {
                nextEl.textContent='NO MORE BUSES TODAY';
                titleEl.textContent='Service Ended';
            }
            // Full schedule list
            const full=document.getElementById('fullSchedule');
            if(full){
                full.innerHTML=schedule.map((bus,i)=>{
                    const bStart=parseTime(bus.b);const mStart=parseTime(bus.m);
                    const isBpast=cur>bStart;const isMpast=cur>mStart;
                    const isBnext=north.bus===bus&&north.state==='UPCOMING';const isMnext=south.bus===bus&&south.state==='UPCOMING';
                    const isBactive=north.bus===bus&&north.state==='ACTIVE';const isMactive=south.bus===bus&&south.state==='ACTIVE';
                    return `<div class="flex justify-between py-1.5 px-2 rounded-lg ${isBactive||isMactive?'bg-blue-500/20 border border-blue-500/20':''} ${isBnext||isMnext?'bg-white/[0.04]':''}">
                        <span class="${isBpast?'line-through opacity-40':''} ${isBnext?'font-black text-blue-300':''} ${isBactive?'text-emerald-300 font-black':''}">${bus.b} ${isBactive?'●':''}</span>
                        <span class="opacity-30">→</span>
                        <span class="${isMpast?'line-through opacity-40':''} ${isMnext?'font-black text-blue-300':''} ${isMactive?'text-emerald-300 font-black':''}">${bus.m} ${isMactive?'●':''}</span>
                    </div>`;
                }).join('');
            }
            // Base status (if not overridden by dispatch)
            const statusIcon=document.getElementById('statusIcon');
            const statusText=document.getElementById('statusText');
            const statusSub=document.getElementById('statusSub');
            if(!applyLiveMidwayStatus()){
                if(!systemActive){
                    statusIcon.className="w-10 h-10 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center mb-2 border border-red-500/20";
                    statusText.className="text-xs font-black text-red-400 uppercase tracking-tight";statusText.textContent="No Service";statusSub.textContent="Resumes tomorrow";
                } else if(north.state==='ACTIVE'||south.state==='ACTIVE'){
                    statusIcon.className="w-10 h-10 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mb-2 border border-emerald-500/20 animate-pulse";
                    statusText.className="text-xs font-black text-emerald-400 uppercase tracking-tight";statusText.textContent="En Route";statusSub.textContent=`${north.state==='ACTIVE'?north.minsLeft:south.minsLeft}m to arrival`;
                } else {
                    statusIcon.className="w-10 h-10 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mb-2 border border-emerald-500/20";
                    statusText.className="text-xs font-black text-emerald-400 uppercase tracking-tight";statusText.textContent="Active";statusSub.textContent=nextMins<9999?`Next in ${nextMins}m`:'';
                }
            }
            // Clock
            const clock=document.getElementById('liveClock');
            if(clock)clock.textContent=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})+' • '+now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
        }
        // Pull to refresh
        let startY=0,pulling=false;
        const scrollEl=document.getElementById('scrollContainer');const pullEl=document.getElementById('pullIndicator');
        scrollEl.addEventListener('touchstart',e=>{if(scrollEl.scrollTop<=0)startY=e.touches[0].clientY},{passive:true});
        scrollEl.addEventListener('touchmove',e=>{
            if(scrollEl.scrollTop>0)return;
            const dy=e.touches[0].clientY-startY;
            if(dy>20&&dy<140){pulling=true;pullEl.classList.add('show');pullEl.textContent=dy>80?'↻ RELEASE TO REFRESH':'↓ PULL TO REFRESH';}
        },{passive:true});
        scrollEl.addEventListener('touchend',()=>{
            if(pulling){const txt=pullEl.textContent;if(txt.includes('RELEASE')){pullEl.textContent='⟳ REFRESHING...';setTimeout(()=>{renderSchedule();pullEl.classList.remove('show');if(navigator.vibrate)navigator.vibrate(20)},600)}else pullEl.classList.remove('show')}
            pulling=false;
        });
        document.addEventListener('DOMContentLoaded',()=>{
            const cur=location.pathname.split("/").pop()||"midway.html";
            document.querySelectorAll('.nav-link').forEach(l=>{if(l.dataset.page===cur){l.classList.remove('text-slate-400');l.classList.add('text-blue-500')}});
            renderSchedule();
            setInterval(renderSchedule,30000); // refresh every 30s for countdown
            setInterval(()=>{const c=document.getElementById('liveClock');if(c){const n=new Date();c.textContent=n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})+' • '+n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}},1000);
        });
        window.renderSchedule=renderSchedule;
    </script>

    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    const firebaseConfig={apiKey:"AIzaSyCRDkusyC05EzBiT8ZBj8JpZd8E5qVd-4g",authDomain:"rvm-software-manifest.firebaseapp.com",databaseURL:"https://rvm-software-manifest-default-rtdb.firebaseio.com",projectId:"rvm-software-manifest",storageBucket:"rvm-software-manifest.appspot.com",messagingSenderId:"1096220577213",appId:"1:1096220577213:web:8c9a0f8f1a2b3c4d5e6f7a"};
    const app=initializeApp(firebaseConfig);const db=getDatabase(app);
    onValue(ref(db,'alerts'),snap=>{const val=snap.val();window.liveAlerts=val?Object.entries(val).map(([id,data])=>({id,...data})):[];if(window.renderSchedule)window.renderSchedule()});
    </script>
