    <script id="vs" type="x-shader/x-vertex">attribute vec2 position; void main(){gl_Position=vec4(position,0.,1.);}</script>
    <script id="fs" type="x-shader/x-fragment">
        precision highp float; uniform float uTime; uniform vec2 uRes;
        void main(){
            vec2 uv = (gl_FragCoord.xy-0.5*uRes)/min(uRes.x,uRes.y);
            float t=uTime*0.1; vec3 c=vec3(0.);
            for(float i=1.;i<4.;i++){ 
                uv.x+=.4/i*sin(i*3.*uv.y+t); 
                uv.y+=.4/i*cos(i*3.*uv.x+t); 
                c+=.004/abs(sin(t+uv.y+uv.x)); 
            }
            gl_FragColor=vec4(c*vec3(.05,.2,.6),1.);
        }
    </script>
    <script>
        const canvas = document.getElementById('canvas'), gl = canvas.getContext('webgl');
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();
        const program = gl.createProgram();
        const addShader = (type, src) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            gl.attachShader(program, s);
        };
        addShader(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
        addShader(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
        gl.linkProgram(program);
        gl.useProgram(program);
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const pos = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(pos);
        gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
        function renderCanvas(t) {
            gl.uniform1f(gl.getUniformLocation(program, 'uTime'), t * 0.001);
            gl.uniform2f(gl.getUniformLocation(program, 'uRes'), canvas.width, canvas.height);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(renderCanvas);
        }
        renderCanvas(0);
        const weekdaySchedule = [{ b: "4:45 AM", m: "6:00 AM" }, { b: "6:00 AM", m: "7:15 AM" }, { b: "7:25 AM", m: "8:45 AM" }, { b: "8:45 AM", m: "10:05 AM" }, { b: "10:15 AM", m: "11:35 AM" }, { b: "11:35 AM", m: "12:55 PM" }, { b: "1:25 PM", m: "2:45 PM" }, { b: "3:05 PM", m: "4:25 PM" }, { b: "4:15 PM", m: "5:35 PM" }, { b: "5:50 PM", m: "7:05 PM" }, { b: "7:05 PM", m: "8:20 PM" }];
        const saturdaySchedule = [{ b: "7:00 AM", m: "8:15 AM" }, { b: "9:40 AM", m: "11:00 AM" }, { b: "12:30 PM", m: "1:50 PM" }, { b: "4:20 PM", m: "5:40 PM" }, { b: "7:05 PM", m: "8:20 PM" }];
        const sundaySchedule = [{ b: "8:00 AM", m: "9:15 AM" }, { b: "10:35 AM", m: "11:55 AM" }, { b: "1:20 PM", m: "2:40 PM" }, { b: "4:05 PM", m: "5:25 PM" }];
        function parseTime(t) {
            if (!t) return 0;
            let [time, mod] = t.split(" ");
            let [h, m] = time.split(":").map(Number);
            if (mod === "PM" && h !== 12) h += 12;
            if (mod === "AM" && h === 12) h = 0;
            return h * 60 + m;
        }
        function getDirectionDisplay(schedule, key, currentTime) {
            const activeBus = schedule.find(bus => {
                const startTime = parseTime(bus[key]);
                return currentTime >= startTime && currentTime < (startTime + 75);
            });
            if (activeBus) return `<span class="text-emerald-400 animate-pulse uppercase font-bold text-[10px] tracking-wider block mt-1">● Route Active</span>${activeBus[key]}`;
            const nextBus = schedule.find(bus => parseTime(bus[key]) > currentTime);
            return nextBus ? `<span class="text-slate-400 font-medium text-[10px] block mt-1">Next Departure</span>${nextBus[key]}` : `<span class="text-slate-500 uppercase text-[10px] font-bold block mt-1">Not In Service</span>`;
        }
        // LIVE ALERTS FROM DISPATCH - GLOBAL
        window.liveAlerts = [];
        function normalizeRoute(r){
            if(!r) return "";
            r = r.toString().trim().toUpperCase();
            if(r.includes("SYSTEM") || r==="ALL" || r==="SYSTEM WIDE") return "SYSTEM";
            if(r==="MIDWAY") return "MIDWAY";
            let m = r.match(/RT\s*0*(\d+)/);
            if(m) return `ROUTE ${m[1]}`;
            m = r.match(/ROUTE\s*0*(\d+)/);
            if(m) return `ROUTE ${m[1]}`;
            return r;
        }
        function getMidwayAlert(){
            if(!window.liveAlerts || window.liveAlerts.length===0) return null;
            const sorted = [...window.liveAlerts].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
            // Prefer MIDWAY specific, then SYSTEM
            let match = sorted.find(a => a.active!==false && normalizeRoute(a.route)==='MIDWAY');
            if(!match) match = sorted.find(a => a.active!==false && normalizeRoute(a.route)==='SYSTEM');
            // also check routes array if dispatch sent multi
            if(!match){
                match = sorted.find(a => {
                    if(a.active===false) return false;
                    if(a.routes && Array.isArray(a.routes)){
                        return a.routes.some(r=>normalizeRoute(r)==='MIDWAY' || normalizeRoute(r)==='SYSTEM');
                    }
                    return false;
                });
            }
            return match||null;
        }
        function applyLiveMidwayStatus(){
            const alert = getMidwayAlert();
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const statusCard = document.getElementById('statusCard');
            const liveBox = document.getElementById('midwayLiveBox');
            
            if(!alert){
                if(liveBox){ liveBox.classList.add('hidden'); }
                // return false so original schedule logic runs
                return false;
            }
            const shortStatus = (alert.badgeStatus || alert.title || 'DELAYED').toString().toUpperCase();
            const sev = (alert.severity||'high').toLowerCase();
            // Show message box
            if(liveBox){
                liveBox.classList.remove('hidden');
                if(sev==='high'){
                    liveBox.className = 'mt-4 rounded-2xl px-4 py-3 text-left border text-[11px] leading-snug bg-red-500/10 border-red-500/20 text-red-200';
                } else if(sev==='medium'){
                    liveBox.className = 'mt-4 rounded-2xl px-4 py-3 text-left border text-[11px] leading-snug bg-amber-500/10 border-amber-500/20 text-amber-200';
                } else {
                    liveBox.className = 'mt-4 rounded-2xl px-4 py-3 text-left border text-[11px] leading-snug bg-emerald-500/10 border-emerald-500/20 text-emerald-200';
                }
                liveBox.innerHTML = `<div class="font-black text-[10px] uppercase tracking-widest mb-1 opacity-70">DISPATCH: ${shortStatus}</div><div class="font-bold">${alert.title||shortStatus}</div><div class="mt-1 opacity-80">${alert.message||''}</div>`;
            }
            // Override status card - SAME LOOK, just different color/text
            if(sev==='high'){
                statusIcon.className = "w-10 h-10 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center mb-2 border border-red-500/20 animate-pulse";
                statusText.className = "text-xs font-black text-red-400 uppercase tracking-tight text-center leading-tight";
                statusText.textContent = shortStatus;
                statusCard.classList.add('border-red-500/20');
            } else if(sev==='medium'){
                statusIcon.className = "w-10 h-10 bg-amber-500/10 text-amber-400 rounded-full flex items-center justify-center mb-2 border border-amber-500/20";
                statusText.className = "text-xs font-black text-amber-400 uppercase tracking-tight text-center leading-tight";
                statusText.textContent = shortStatus;
            } else {
                // info / ON TIME
                if(shortStatus.includes('ON TIME')){
                    statusIcon.className = "w-10 h-10 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mb-2 border border-emerald-500/20";
                    statusText.className = "text-xs font-black text-emerald-400 uppercase tracking-tight text-center leading-tight";
                    statusText.textContent = "ON TIME";
                } else {
                    statusIcon.className = "w-10 h-10 bg-blue-500/10 text-blue-400 rounded-full flex items-center justify-center mb-2 border border-blue-500/20";
                    statusText.className = "text-xs font-black text-blue-400 uppercase tracking-tight text-center leading-tight";
                    statusText.textContent = shortStatus;
                }
            }
            return true; // we overrode
        }
        function renderSchedule() {
            const now = new Date();
            const cur = now.getHours() * 60 + now.getMinutes();
            const d = now.getDay();
            let schedule = weekdaySchedule;
            let title = "Weekday Schedule";
            if (d === 0) { schedule = sundaySchedule; title = "Sunday Schedule"; }
            else if (d === 6) { schedule = saturdaySchedule; title = "Saturday Schedule"; }
            document.getElementById('dayTitle').textContent = title;
            const northText = getDirectionDisplay(schedule, 'b', cur);
            const southText = getDirectionDisplay(schedule, 'm', cur);
            const lastDeparture = parseTime(schedule[schedule.length - 1].m) + 75;
            const systemActive = cur < lastDeparture;
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            if (!systemActive) {
                statusIcon.className = "w-10 h-10 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center mb-2 border border-red-500/20";
                statusText.className = "text-xs font-black text-red-400 uppercase tracking-tight";
                statusText.textContent = "No Service";
            } else {
                statusIcon.className = "w-10 h-10 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mb-2 border border-emerald-500/20";
                statusText.className = "text-xs font-black text-emerald-400 uppercase tracking-tight";
                statusText.textContent = "Active";
            }
            document.getElementById('busButtons').innerHTML = `
                <div class="bg-blue-600/90 border border-blue-400/20 p-5 rounded-2xl text-white shadow-lg btn-pulse">
                    <p class="text-[9px] font-black uppercase opacity-70 mb-1 tracking-widest">Northbound</p>
                    <p class="text-sm font-black leading-tight uppercase tracking-wide">Bourbonnais → Midway</p>
                    <p class="text-lg font-black mt-1 leading-none">${northText}</p>
                </div>
                <div class="bg-slate-900/80 border border-white/5 p-5 rounded-2xl text-white shadow-lg">
                    <p class="text-[9px] font-black uppercase opacity-60 mb-1 tracking-widest">Southbound</p>
                    <p class="text-sm font-black leading-tight uppercase tracking-wide">Midway → Bourbonnais</p>
                    <p class="text-lg font-black mt-1 leading-none">${southText}</p>
                </div>
            `;
            // AFTER normal schedule logic, check if dispatch is overriding - SAME LOOK, just status info
            applyLiveMidwayStatus();
        }
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname.split("/").pop() || "midway.html";
            document.querySelectorAll('.nav-link').forEach(link => {
                if(link.getAttribute('data-page') === currentPath) {
                    link.classList.remove('text-slate-400');
                    link.classList.add('text-blue-500');
                }
            });
            renderSchedule();
            setInterval(renderSchedule, 30000);
        });
        window.renderSchedule = renderSchedule;
    </script>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCRDkusyC05EzBiT8ZBj8JpZd8E5qVd-4g",
      authDomain: "rvm-software-manifest.firebaseapp.com",
      databaseURL: "https://rvm-software-manifest-default-rtdb.firebaseio.com",
      projectId: "rvm-software-manifest",
      storageBucket: "rvm-software-manifest.appspot.com",
      messagingSenderId: "1096220577213",
      appId: "1:1096220577213:web:8c9a0f8f1a2b3c4d5e6f7a"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    onValue(ref(db, 'alerts'), (snap) => {
      const val = snap.val();
      window.liveAlerts = val ? Object.entries(val).map(([id, data]) => ({ id, ...data })) : [];
      if (window.renderSchedule) window.renderSchedule();
    });
    </script>
