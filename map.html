function haversine(lat1, lon1, lat2, lon2){
  const R=6371e3; const toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1); const dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}
function findNearestStop(){
  const btn=document.getElementById('gpsBtn'); const txt=document.getElementById('gpsText'); const icon=document.getElementById('gpsIcon'); const res=document.getElementById('gpsResult');
  if(!navigator.geolocation){
    if(res){res.classList.remove('hidden'); res.innerHTML='⚠ Location not supported';}
    return;
  }
  if(txt) txt.textContent='LOCATING...'; if(btn) btn.disabled=true; if(icon) icon.textContent='⌛';
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude, longitude} = pos.coords;
    let all=[]; 
    routes.forEach(route=>{
      route.stops.forEach(stop=>{
        const c=STOP_COORDS[stop.name];
        if(!c) return;
        const d=haversine(latitude, longitude, c[0], c[1]);
        all.push({stop, route, dist:d});
      });
    });
    all.sort((a,b)=>a.dist-b.dist);
    const top = all.slice(0,3); // 3 closest
    if(top.length>0){
      const best = top[0];
      const miles = (best.dist*0.000621371).toFixed(2);
      if(txt) txt.textContent=`NEAREST: ${best.stop.name} • ${best.route.name} (${miles} mi)`;
      if(res){
        res.classList.remove('hidden');
        let html = `<div class="font-black text-blue-300 mb-1">📍 Closest to you:</div>`;
        top.forEach((item, idx)=>{
          const m = (item.dist*0.000621371).toFixed(2);
          const isBest = idx===0;
          html += `<div class="flex items-center justify-between py-1.5 ${isBest?'bg-white/[0.06] rounded-lg px-2':''}"><span class="${isBest?'font-bold':''}">${isBest?'⭐':''} ${item.stop.name} <span class="opacity-60">(${m} mi) on ${item.route.name}</span></span><button onclick="selectRoute(${item.route.id})" class="ml-2 bg-blue-500 text-slate-900 px-2.5 py-1 rounded-full text-[10px] font-black">${isBest?'USE':'SELECT'}</button></div>`;
        });
        html += `<div class="mt-2 text-[10px] opacity-60">Suggestion only</div>`;
        res.innerHTML=html;
      }
      // Highlight but DO NOT force - just scroll route list to show best on top
      // Pre-fill search with best stop name as hint (user can clear)
      // No confirm() popup
    } else {
      if(res){res.classList.remove('hidden'); res.innerHTML='⚠ No stops with GPS data found';}
    }
    if(btn) btn.disabled=false; if(icon) icon.textContent='📍';
  }, err=>{
    if(res){res.classList.remove('hidden'); res.innerHTML=`⚠ Location error: ${err.message} • Enable location`;}
    if(txt) txt.textContent='USE MY LOCATION • FIND NEAREST STOP'; if(btn) btn.disabled=false; if(icon) icon.textContent='📍';
  }, {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
}
// === PULL TO REFRESH ===
let pullStartY=0; let pulling=false;
const appContainer=document.querySelector('.app-container');
const pullIndicator=document.getElementById('pullIndicator');
if(appContainer){
  appContainer.addEventListener('touchstart', e=>{
    if(appContainer.scrollTop===0){pullStartY=e.touches[0].clientY; pulling=true;}
  }, {passive:true});
  appContainer.addEventListener('touchmove', e=>{
    if(!pulling) return;
    const curY=e.touches[0].clientY;
    const diff=curY-pullStartY;
    if(diff>0 && appContainer.scrollTop===0){
      if(pullIndicator){
        pullIndicator.classList.add('active');
        pullIndicator.innerHTML = diff>70 ? '<span>↻</span> Release to refresh...' : '<span>↓</span> Pull to refresh...';
      }
      if(diff>70){ appContainer.style.transform=`translateY(${Math.min(diff*0.4, 60)}px)`; }
    }
  }, {passive:true});
  appContainer.addEventListener('touchend', e=>{
    if(!pulling) return;
    pulling=false;
    const diff=e.changedTouches[0].clientY-pullStartY;
    appContainer.style.transform='translateY(0px)';
    if(pullIndicator) pullIndicator.classList.remove('active');
    if(diff>70){ 
      // refresh
      if(pullIndicator){pullIndicator.classList.add('active'); pullIndicator.innerHTML='<span class="animate-spin">↻</span> Refreshing...';}
      setTimeout(()=>{ update(); if(pullIndicator) pullIndicator.classList.remove('active'); }, 600);
      if(navigator.vibrate) navigator.vibrate(50);
    }
    pullStartY=0;
  });
}
window.addEventListener('click',(e)=>{if(!e.target.closest('#routeDropdownRoot')){routeMenuOpen=false;document.getElementById('routeMenu').classList.add('hidden');document.getElementById('routeArrow').textContent='▼';}});
update();setInterval(update,30000);
// SERVICE WORKER REGISTER - SIMPLE, NO PUSH
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/rvmapp/sw.js').catch(()=>{});
  });
}
</script>

// RED DOT LOGIC FOR ALERTS TAB
const alertsRefForDot = ref(db, 'alerts');
onValue(alertsRefForDot, (snap)=>{
  const val = snap.val();
  const dot = document.getElementById('noticesDot');
  const countEl = document.getElementById('noticesCount');
  const statusText = document.getElementById('statusText');
  if(!dot) return;
  if(!val){
    dot.classList.add('hidden');
    if(countEl) countEl.classList.add('hidden');
    return;
  }
  const entries = Object.entries(val).map(([id,data])=>({id,...data}))
    .filter(a=>a.active!==false && (!a.expiresAtTS || Date.now() < a.expiresAtTS))
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const lastSeen = parseInt(localStorage.getItem('rvm_last_seen_notices_ts')||'0');
  const unread = entries.filter(a=>(a.createdAt||0) > lastSeen);
  if(unread.length>0 && entries.length>0){
    dot.classList.remove('hidden');
    if(countEl){
      countEl.textContent = unread.length>9?'9+':unread.length;
      countEl.classList.remove('hidden');
    }
    if(navigator.vibrate) navigator.vibrate([100,50,100]);
    const alertBanner=document.getElementById('alertBanner'); const alertTextEl=document.getElementById('alertText');
    if(alertBanner && alertTextEl && unread[0]){
      alertBanner.classList.remove('hidden');
      alertTextEl.innerHTML = `<b class="text-red-400">${unread[0].route||'SYSTEM'} ALERT:</b> ${unread[0].title} - Tap NOTICES`;
    } else if(alertBanner){
      alertBanner.classList.add('hidden');
    }
  } else {
    dot.classList.add('hidden');
    if(countEl) countEl.classList.add('hidden');
  }
});
</script>
